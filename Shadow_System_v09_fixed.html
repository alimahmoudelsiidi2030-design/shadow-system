if(c.st){if(/^(انهاء|خروج)$/.test(n)){c.st=null;return{k:1,t:'أنهيت وضع المذاكرة.'}}if(c.st.ph==='wait'){if(x.length<120)return{k:1,t:'الصق نص الدرس (120 حرفًا على الأقل) لأولّد أسئلة منه. اكتب «إنهاء» للخروج.'};const qs=mkQs(x);if(!qs.length)return{k:1,t:'لم أستطع توليد أسئلة من هذا النص بالقواعد المحلية. جرّب نصًا أطول بجمل كاملة.'};c.st={ph:'qa',qs,i:0,ok:0};const parts=x.split(/\n+/).filter(s=>s.trim()).slice(0,6).map(s=>'• '+s.trim().split(/\s+/).slice(0,12).join(' ')+'…').join('\n');return{k:1,t:'أجزاء النص (اختصار آلي لأول كلمات كل فقرة):\n'+parts+'\n\nأسئلة من نصك (توليد بقواعد، ليس شرحًا ذكيًا):\n1) '+qs[0].q}}const q=c.st.qs[c.st.i],okk=nz(x)===nz(q.a);if(okk)c.st.ok++;c.st.i++;const fb=okk?'صحيح.':'الإجابة الصحيحة من النص: '+q.a;if(c.st.i>=c.st.qs.length){const r=c.st.ok+'/'+c.st.qs.length;c.st=null;return{k:1,t:fb+'\nانتهت الأسئلة: نتيجتك '+r+'. لا تُمنح XP من هذا التدريب.'}}return{k:1,t:fb+'\n'+(c.st.i+1)+') '+c.st.qs[c.st.i].q}}

function mkQs(t){const ss=t.split(/(?<=[.!?؟\n])\s+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=6),qs=[];for(const s of ss){const ws=s.split(/\s+/),c=ws.map((x,i)=>[x.replace(/[.,،؛:!?؟"()«»]/g,''),i]).filter(([x])=>x.length>=5).sort((a,b)=>b[0].length-a[0].length)[0];if(c){ws[c[1]]='_____';qs.push({q:ws.join(' '),a:c[0]})}if(qs.length>=4)break}return qs}

function sqOverview(){const q=sq(),c=sqSummary(),leaders=sqMembersByRank().slice(0,3),recent=q.log.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,5);return`<h2>نظرة عامة</h2><div class='card sq-card'><b>${E(q.name)}</b><div class='sq-muted'>بيانات الفرقة محفوظة محليًا على هذا الجهاز؛ لا يوجد حساب أعضاء أو مزامنة.</div></div><div class='grid'><div class='card'><div class='m'>الأعضاء النشطون</div><div class='big'>${c.members}</div></div><div class='card'><div class='m'>المهام الحالية</div><div class='big'>${c.open}</div></div><div class='card'><div class='m'>القوانين النشطة</div><div class='big'>${c.laws}</div></div><div class='card'><div class='m'>مهام مستحقة / مكتملة</div><div class='big'>${c.done} / ${c.due}</div><div class='m'>متأخرة: ${c.overdue}</div></div></div><div class='g2'><div class='card'><div class='row sp'><b>ترتيب XP المسجل للفرقة</b><button class='b' data-t='members' onclick='sqOpenTab(this.dataset.t)'>الأعضاء</button></div>${leaders.map((m,i)=>`<div class='row sp' style='margin-top:8px'><span>${i+1}. ${E(m.name)} <span class='tag'>${sqTitle(m.id)}</span></span><b>${Math.max(0,+m.xp||0)} XP</b></div>`).join('')||'<div class=\"m\">أضف أعضاء لبدء الترتيب.</div>'}<div class='sq-muted' style='margin-top:8px'>اللقب يتبع XP والترتيب فقط، ولا يمنح صلاحيات إدارية.</div></div><div class='card'><b>القوانين النشطة</b>${q.laws.filter(x=>x.status==='active').slice(0,4).map(x=>`<div class='m' style='margin-top:6px'>• ${E(x.title)}</div>`).join('')||'<div class=\"m\">لا توجد قوانين نشطة.</div>'}<div style='margin-top:8px'><button class='b' data-t='laws' onclick='sqOpenTab(this.dataset.t)'>إدارة القوانين</button></div></div></div><div class='card'><b>آخر نشاط محفوظ</b>${recent.map(x=>`<div class='m' style='margin-top:5px'>${new Date(x.at).toLocaleString('ar-EG')} · ${E(x.text)}</div>`).join('')||'<div class=\"m\">لا يوجد نشاط بعد.</div>'}</div>`}
function sqGuide(){return`<h2>شرح الفرقة</h2><div class='card'><b>طريقة العمل</b><p>هذا سجل محلي لإدارة مجموعة على جهاز واحد. الأعضاء لا يسجلون الدخول ولا يرون تحديثات بعضهم على أجهزة أخرى؛ يمكنك نقل بيانات الفرقة فقط من إعداداتها.</p><p>أضف عضوًا، ثم سجّل له رصيد نقاط الفرقة عند الحاجة. هذا الرصيد مستقل تمامًا عن XP الشخصي والرتب والمهام والإحصائيات الأساسية في نظام الظل.</p></div><div class='card'><b>الألقاب والصلاحيات</b><ul><li>أعلى رصيد XP مسجل: «الملك»؛ الثاني: «الوزير»؛ بقية الأعضاء النشطين: «عضو».</li><li>عند التعادل، يسبق العضو الأقدم تاريخ إضافة، ثم يُستخدم المعرّف الثابت لكسر التعادل.</li><li>صلاحية «إدارة» حقل تنظيمي مستقل يُغيّره مشغّل الجهاز يدويًا، ولا تنتج عن ترتيب XP.</li><li>بما أن التطبيق محلي، لا تُعد هذه الصلاحيات حاجزًا أمنيًا؛ يمكن لمن يملك الملف تعديل بياناته.</li></ul></div><div class='card'><b>القوانين والمهام</b><p>القوانين القديمة تُؤرشف ولا تُحذف بصمت. مراجعة القوانين تُسجّل محليًا يوم الخميس مع ملخص الأسبوع، ولا تمثل تصويتًا أو موافقة من أجهزة أخرى.</p><p>مهام الفرقة لها سجل مستقل، ويمكن تسجيل المشاركين عند الإكمال. لا تمنح XP شخصيًا ولا تغيّر مهام أو إحصائيات نظام الظل.</p></div><div class='card'><b>تحليل بانتي</b><p>يعرض خمسة مؤشرات بأوزان 30% و20% و25% و15% و10%. المؤشر الذي لا يملك عينة كافية يظهر «بيانات غير كافية» بدل إعطائه درجة كاملة. لا يظهر المجموع إلا عندما تتوفر بيانات لما لا يقل عن 70% من الوزن.</p></div>`}
function sqMembersTab(){const q=sq(),rank=sqMembersByRank(),inactive=q.members.filter(m=>m.status==='inactive');return`<h2>الأعضاء</h2><div class='card'><b>إضافة عضو</b><div class='row' style='margin-top:6px'><input id='sq-new-name' placeholder='الاسم الظاهر' style='flex:1'><input id='sq-new-xp' type='number' min='0' value='0' aria-label='XP الفرقة' style='width:110px'><label><input id='sq-new-admin' type='checkbox'> صلاحية إدارة تنظيمية</label><button class='b p' onclick='sqMemberAdd()'>إضافة عضو</button></div><div class='sq-muted'>XP هنا قيمة محلية للترتيب والتحليل، ولا ترتبط برصيدك الشخصي في نظام الظل.</div></div>${rank.map((m,i)=>`<div class='card sq-person'><div><div class='row'><b>${i+1}. ${E(m.name)}</b><span class='tag'>${sqTitle(m.id)}</span><span class='tag'>${m.admin?'إدارة تنظيمية':'عضو'}</span><span class='tag'>نشط</span></div><div class='m'>${Math.max(0,+m.xp||0)} XP · أُضيف ${m.addedAt?new Date(m.addedAt).toLocaleDateString('ar-EG'):'—'} · مشاركة مسجلة: ${q.log.filter(x=>x.type==='task-complete'&&(x.memberIds||[]).includes(m.id)).length}</div></div><div class='sq-actions'><button class='b' data-id='${E(m.id)}' onclick='sqMemberEdit(this.dataset.id)'>تعديل الاسم وXP</button><button class='b' data-id='${E(m.id)}' onclick='sqMemberAdmin(this.dataset.id)'>${m.admin?'إلغاء الإدارة':'تعيين إدارة'}</button><button class='b' data-id='${E(m.id)}' onclick='sqMemberToggle(this.dataset.id)'>إيقاف العضو</button></div></div>`).join('')||'<div class=\"card m\">لا يوجد أعضاء بعد.</div>'}${inactive.length?`<h3>أعضاء غير نشطين</h3>${inactive.map(m=>`<div class='card row sp'><span>${E(m.name)} · ${Math.max(0,+m.xp||0)} XP</span><button class='b' data-id='${E(m.id)}' onclick='sqMemberToggle(this.dataset.id)'>إعادة التفعيل</button></div>`).join('')}`:''}`}
function sqMemberAdd(){const e=document.getElementById('sq-new-name'),x=document.getElementById('sq-new-xp'),a=document.getElementById('sq-new-admin');if(!e)return;const name=e.value.trim(),xp=Number(x.value);if(!name)return alert('اكتب اسم العضو');if(!Number.isFinite(xp)||xp<0)return alert('أدخل XP صالحًا غير سالب');const m={id:sqId('member'),name,xp:Math.floor(xp),admin:!!a.checked,status:'active',addedAt:new Date().toISOString(),participation:[]};sq().members.push(m);sqLog('member-add','إضافة العضو «'+name+'»',m.id);save();render()}
function sqMemberEdit(id){const m=sqMember(id);if(!m)return;const n=prompt('الاسم الظاهر:',m.name);if(n===null)return;const name=n.trim();if(!name)return alert('الاسم لا يمكن أن يكون فارغًا');const raw=prompt('XP الفرقة (قيمة مستقلة عن XP الشخصي):',String(m.xp));if(raw===null)return;const xp=Number(raw);if(!Number.isFinite(xp)||xp<0||xp>1e9)return alert('أدخل قيمة XP صحيحة بين 0 و1,000,000,000');const reason=(prompt('سبب تعديل نقاط الفرقة (إلزامي):')||'').trim();if(!reason)return alert('اكتب سببًا حتى يبقى سجل التعديل واضحًا');const delta=Math.floor(xp)-(+m.xp||0),old=m.name;m.name=name;m.xp=Math.floor(xp);if(delta)sqLog('member-xp','تعديل XP للعضو «'+name+'»: '+(delta>0?'+':'')+delta+' — '+reason,id,{delta,memberId:id});if(old!==name)sqLog('member-edit','تغيير اسم «'+old+'» إلى «'+name+'»',id);save();render()}
function sqMemberAdmin(id){const m=sqMember(id);if(!m)return;m.admin=!m.admin;sqLog('member-role',(m.admin?'تعيين':'إلغاء')+' صلاحية الإدارة التنظيمية لـ «'+m.name+'»',id);save();render()}
function sqMemberToggle(id){const m=sqMember(id);if(!m)return;m.status=m.status==='inactive'?'active':'inactive';sqLog('member-status',(m.status==='inactive'?'إيقاف':'إعادة تفعيل')+' العضو «'+m.name+'»',id);save();render()}
function sqLawsTab(){const q=sq(),active=q.laws.filter(x=>x.status==='active'),week=wk0(today()),review=q.reviews.find(x=>x.weekStart===week),thu=new Date().getDay()===4,summary=active.map(x=>'• '+x.title).join('\n')||'لا توجد قوانين نشطة';return`<h2>القوانين</h2><div class='card'><b>إضافة قانون</b><input id='sq-law-title' placeholder='عنوان القانون' style='width:100%;margin:6px 0'><textarea id='sq-law-body' placeholder='نص القانون' style='direction:rtl'></textarea><button class='b p' onclick='sqLawAdd()'>حفظ القانون</button></div><div class='card'><div class='row sp'><b>مراجعة الخميس</b><span class='tag'>الأسبوع ${week} — ${add(week,6)}</span></div><div class='m'>${review?'تم تسجيل مراجعة هذا الأسبوع في '+new Date(review.at).toLocaleString('ar-EG'):thu?'مراجعة هذا الأسبوع متاحة الآن.':'تُسجّل المراجعة يوم الخميس فقط.'} المراجعة محلية ولا تمثل تصويتًا متعدد الأجهزة.</div><button class='b' ${!thu||review?'disabled':''} onclick='sqLawReview()'>تأكيد مراجعة قوانين الأسبوع</button></div><h3>قوانين نشطة (${active.length})</h3>${active.map(x=>`<div class='card'><div class='row sp'><b>${E(x.title)}</b><span class='tag'>نشط · ${new Date(x.createdAt).toLocaleDateString('ar-EG')}</span></div><div style='white-space:pre-wrap;margin-top:6px'>${E(x.body||'')}</div><div class='m'>معرّف ثابت: ${E(x.id)} · سجل تعديلات: ${(x.history||[]).length}</div><div class='sq-actions' style='margin-top:8px'><button class='b' data-id='${E(x.id)}' onclick='sqLawEdit(this.dataset.id)'>تعديل</button><button class='b' data-id='${E(x.id)}' onclick='sqLawArchive(this.dataset.id)'>أرشفة</button></div></div>`).join('')||'<div class=\"card m\">لا توجد قوانين نشطة.</div>'}<h3>مراجعات محفوظة</h3>${q.reviews.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,8).map(x=>`<div class='card'><b>الأسبوع ${E(x.weekStart)} – ${E(x.weekEnd)}</b><div class='m'>${new Date(x.at).toLocaleString('ar-EG')} · ${x.activeLawIds.length} قانون نشط وقت المراجعة</div></div>`).join('')||'<div class=\"m\">لا توجد مراجعات مسجلة.</div>'}<h3>الأرشيف</h3>${q.laws.filter(x=>x.status==='archived').map(x=>`<div class='card'><b>${E(x.title)}</b><span class='tag'>مؤرشف</span><div class='m'>${E(x.body||'')}</div><button class='b' data-id='${E(x.id)}' onclick='sqLawRestore(this.dataset.id)'>إعادة التفعيل</button></div>`).join('')||'<div class=\"m\">لا قوانين مؤرشفة.</div>'}`}
function sqLawAdd(){const title=document.getElementById('sq-law-title').value.trim(),body=document.getElementById('sq-law-body').value.trim();if(!title||!body)return alert('اكتب عنوان القانون ونصه');const x={id:sqId('law'),title,body,status:'active',createdAt:new Date().toISOString(),updatedAt:null,history:[]};sq().laws.push(x);sqLog('law-add','إضافة قانون «'+title+'»',x.id);save();render()}
function sqLawEdit(id){const x=sq().laws.find(z=>z.id===id);if(!x)return;const title=prompt('عنوان القانون:',x.title);if(title===null)return;const body=prompt('نص القانون:',x.body||'');if(body===null)return;if(!title.trim()||!body.trim())return alert('العنوان والنص مطلوبان');x.history=x.history||[];x.history.push({at:new Date().toISOString(),title:x.title,body:x.body});x.title=title.trim();x.body=body.trim();x.updatedAt=new Date().toISOString();sqLog('law-edit','تعديل القانون «'+x.title+'» مع حفظ النسخة السابقة',id);save();render()}
function sqLawArchive(id){const x=sq().laws.find(z=>z.id===id);if(!x||!confirm('أرشفة القانون «'+x.title+'»؟ سيبقى محفوظًا في الأرشيف.'))return;x.status='archived';x.updatedAt=new Date().toISOString();sqLog('law-archive','أرشفة القانون «'+x.title+'»',id);save();render()}
function sqLawRestore(id){const x=sq().laws.find(z=>z.id===id);if(!x||!confirm('إعادة تفعيل القانون «'+x.title+'»؟'))return;x.status='active';x.updatedAt=new Date().toISOString();sqLog('law-restore','إعادة تفعيل القانون «'+x.title+'»',id);save();render()}
function sqLawReview(){const d=new Date();if(d.getDay()!==4)return alert('مراجعة القوانين الأسبوعية تُسجّل يوم الخميس.');const q=sq(),week=wk0(today());if(q.reviews.some(x=>x.weekStart===week))return alert('سُجلت مراجعة هذا الأسبوع بالفعل.');const active=q.laws.filter(x=>x.status==='active'),names=active.map(x=>'• '+x.title).join('\n')||'• لا توجد قوانين نشطة';if(!confirm('مراجعة قوانين الأسبوع '+week+' إلى '+add(week,6)+'؟\nعدد القوانين النشطة: '+active.length+'\n'+names+'\n\nسيُسجل هذا التأكيد محليًا مرة واحدة لهذا الأسبوع.'))return;const r={id:sqId('review'),weekStart:week,weekEnd:add(week,6),at:new Date().toISOString(),activeLawIds:active.map(x=>x.id),notes:''};q.reviews.push(r);sqLog('law-review','مراجعة قوانين الأسبوع '+week,r.id,{weekStart:week});save();render()}
function sqTaskForm(){const members=sqMembersByRank();return`<div class='card'><b>إنشاء مهمة جماعية</b><div class='row' style='margin-top:6px'><input id='sq-task-title' placeholder='عنوان المهمة' style='flex:1'><input id='sq-task-date' type='date' value='${today()}' aria-label='تاريخ الاستحقاق'></div><textarea id='sq-task-desc' placeholder='وصف اختياري' style='direction:rtl;margin-top:6px'></textarea><div class='row' style='margin-top:6px'><label>المسؤول <select id='sq-task-owner'><option value=''>غير محدد</option>${members.map(m=>`<option value='${E(m.id)}'>${E(m.name)}</option>`).join('')}</select></label></div><div class='m'>الأعضاء المشاركون</div><div class='sq-checks'>${members.map(m=>`<label><input type='checkbox' data-sq-newmember='${E(m.id)}'> ${E(m.name)}</label>`).join('')||'<span class=\"m\">أضف عضوًا أولًا لتعيين المشاركين.</span>'}</div><button class='b p' onclick='sqTaskAdd()'>إنشاء المهمة</button></div>`}
function sqTaskAdd(){const title=document.getElementById('sq-task-title').value.trim(),description=document.getElementById('sq-task-desc').value.trim(),dueDate=document.getElementById('sq-task-date').value,owner=document.getElementById('sq-task-owner').value;if(!title)return alert('اكتب عنوان المهمة');if(!validLocalDate(dueDate))return alert('اختر تاريخ استحقاق صالحًا');const participants=[...document.querySelectorAll('[data-sq-newmember]:checked')].map(x=>x.dataset.sqNewmember);if(owner&&!participants.includes(owner))participants.push(owner);const t={id:sqId('task'),title,description,responsibleId:owner||null,participants,dueDate,createdAt:new Date().toISOString(),createdBy:'مشغّل الجهاز المحلي',status:'new',completedAt:null,completedBy:[],history:[]};t.history.push({at:t.createdAt,type:'created',note:'إنشاء مهمة جماعية'});sq().tasks.push(t);sqLog('task-create','إنشاء مهمة فرقة: «'+title+'»',t.id);save();render()}
function sqTaskEdit(id){const t=sq().tasks.find(x=>x.id===id);if(!t||t.status==='done')return alert('لا يمكن تعديل مهمة مكتملة.');const n=prompt('عنوان المهمة:',t.title);if(n===null)return;const description=prompt('الوصف:',t.description||'');if(description===null)return;const date=prompt('تاريخ الاستحقاق (YYYY-MM-DD):',t.dueDate);if(date===null)return;if(!n.trim()||!validLocalDate(date))return alert('العنوان أو تاريخ الاستحقاق غير صالح');const active=sqMembersByRank(),old={title:t.title,description:t.description,dueDate:t.dueDate,responsibleId:t.responsibleId,participants:t.participants||[]},opts=active.map((m,i)=>(i+1)+'. '+m.name+(m.id===t.responsibleId?' (المسؤول)':'')).join('\n')||'لا يوجد أعضاء نشطون',cur=(t.participants||[]).map(id=>active.findIndex(m=>m.id===id)+1).filter(i=>i>0).join(','),p=prompt('أرقام المشاركين مفصولة بفاصلة:\n'+opts,cur);if(p===null)return;const parts=p.split(/[,،\s]+/).filter(Boolean).map(Number).filter(i=>Number.isInteger(i)&&i>=1&&i<=active.length).map(i=>active[i-1].id),o=prompt('رقم المسؤول من القائمة، أو اتركه فارغًا:\n'+opts,active.findIndex(m=>m.id===t.responsibleId)>=0?String(active.findIndex(m=>m.id===t.responsibleId)+1):'');if(o===null)return;const owner=o.trim()?active[Number(o)-1]?.id||null:null;if(o.trim()&&!owner)return alert('رقم المسؤول غير صالح');if(owner&&!parts.includes(owner))parts.push(owner);t.title=n.trim();t.description=description.trim();t.dueDate=date;t.participants=[...new Set(parts)];t.responsibleId=owner;t.history=t.history||[];t.history.push({at:new Date().toISOString(),type:'edit',before:old,after:{title:t.title,description:t.description,dueDate:t.dueDate,responsibleId:owner,participants:t.participants}});sqLog('task-edit','تعديل مهمة الفرقة «'+t.title+'»',id);save();render()}
function sqTaskStatus(id,status){const t=sq().tasks.find(x=>x.id===id);if(!t||t.status==='done'||t.status==='cancelled')return;if(!['new','active','cancelled'].includes(status))return;const old=t.status;t.status=status;t.history=t.history||[];t.history.push({at:new Date().toISOString(),type:'status',from:old,to:status});sqLog('task-status','تغيير حالة «'+t.title+'» إلى '+({new:'جديدة',active:'قيد التنفيذ',cancelled:'ملغاة'}[status]),id);save();render()}
function sqTaskComplete(btn){const id=btn.dataset.id,t=sq().tasks.find(x=>x.id===id);if(!t||t.status==='done'||t.status==='cancelled')return alert('المهمة مكتملة أو ملغاة بالفعل.');const ids=[...document.querySelectorAll('[data-sq-complete=\"'+CSS.escape(id)+'\"]:checked')].map(x=>x.value);if(!ids.length)return alert('حدد عضوًا واحدًا على الأقل سجّل مشاركة فعلية.');t.status='done';t.completedAt=new Date().toISOString();t.completedBy=[...new Set(ids)];t.history=t.history||[];t.history.push({at:t.completedAt,type:'completed',memberIds:t.completedBy.slice()});sqLog('task-complete','إكمال مهمة الفرقة «'+t.title+'» بمشاركة '+t.completedBy.map(x=>sqMember(x)?.name||'عضو').join('، '),id,{memberIds:t.completedBy.slice(),dueDate:t.dueDate});save();render()}

function routineFormDateFixed(){const td=today();if(rv==='week'){const w=wk0(rd);return td<w?w:td}if(rv==='month'){const first=rmn+'-01';return td<first?first:td}return validLocalDate(rd)&&rd>=td?rd:td}
function routineAddFormFixed(){const target=routineFormDateFixed(),label={daily:'اليومي',weekly:'الأسبوعي',monthly:'الشهري'}[rr]||rr;return`<div class='card' style='margin:10px 0'><b>إضافة مهمة جديدة · الروتين ${label}</b><form id='rf' onsubmit='return false'><div class='row' style='margin-top:8px'><label>تاريخ الاستحقاق <input name='dueDate' type='date' value='${target}' min='${today()}' required></label><input name='title' placeholder='اسم المهمة' style='flex:1' required><label>المدة بالدقائق <input name='mins' type='number' value='30' min='5' style='width:86px' aria-label='الدقائق'></label></div><textarea name='note' placeholder='تفاصيل المهمة (اختياري)' style='width:100%;margin-top:6px'></textarea><div class='row' style='margin-top:6px'><select name='imp' aria-label='الأهمية'><option value='1'>أهمية منخفضة</option><option value='2' selected>متوسطة</option><option value='3'>مرتفعة</option></select><select name='diff' aria-label='الصعوبة'><option value='1'>سهلة</option><option value='2' selected>متوسطة</option><option value='3'>صعبة</option></select><select name='sk' aria-label='المهارة'><option value=''>مهارة: تلقائي</option>${SK.map(b=>`<option value='${b[0]}'>${b[1]}</option>`).join('')}</select><select name='cat' aria-label='التصنيف'>${S.cats.map(x=>`<option>${E(x)}</option>`).join('')}</select><label><input type='checkbox' name='opt'> اختيارية</label></div><div class='row' style='margin-top:6px'><select name='mode' aria-label='نطاق التكرار'>${scOpts()}</select><input id='rn' type='number' min='1' max='28' value='3' style='width:70px' aria-label='عدد مرات التوزيع'><button class='b' type='button' onclick='sg()'>اقترح التوزيع</button></div><div class='row' style='margin-top:6px'>${DN.map((n,i)=>`<label><input type='checkbox' class='dw' value='${(i+6)%7}'> ${n}</label>`).join('')}</div><div class='row' style='margin-top:6px'><label>وقت التنفيذ والتذكير (اختياري) <input type='time' name='at'></label></div><input name='doms' placeholder='أيام الشهر مثل 3,12,24' style='width:100%;margin-top:6px'><div class='m'>يبدأ التكرار من التاريخ المحدد أعلاه. اكتب عدد المرات ثم اضغط «اقترح التوزيع» أو اختر الأيام بنفسك. كل موعد مهمة مستقلة تُكافأ مرة واحدة.</div><button class='b p' type='button' style='margin-top:6px' onclick='rtAdd()'>إضافة</button></form></div>`}
function routineWeekNotice(date){const end=wkEnd(date);return'\n\n📅 '+(date===end?'سيتم إنشاء مهمة لهذا اليوم فقط (يوم الجمعة '+end+') ثم يتوقف القالب تلقائيًا.':'سيتم إنشاء المهام لبقية أيام الأسبوع الحالي فقط، حتى يوم الجمعة الموافق '+end+'. بعد انتهاء الأسبوع، سيتوقف هذا القالب تلقائيًا ولن يُنشئ مهامًا جديدة في الأسبوع القادم.')}
dayV=function(){const td=today(),L=S.tasks.filter(t=>t.rt===rr&&t.date===rd&&t.status!=='cancelled').sort((a,b)=>a.id-b.id),c=sum(rd,rd,fr0(rr));return`<div class='row sp'><button class='b' onclick='bk()'>← الروتين</button>${planBtn()}${nv('rd=add(rd,-1);render()','rd=add(rd,1);render()','rd=today();render()')}</div><h2>${fd(rd,1)}</h2>${rd>=td?routineAddFormFixed():''}<div class='card row'>${ring(c.pct)}<span>إنجاز اليوم · ${c.dn} مكتملة · ${c.rm} متبقية · ${c.ms} فائتة${rd>td?' (يوم قادم: لا يُحسب إخفاقًا)':''}</span></div>${celOn(L)?celHTML():''}${celOn(L)?'':L.map(t=>taskRow(t,t.date<td?1:0)+`<button class='b' style='margin:-4px 0 10px' onclick='rtEdit(${t.id})'>✎ تعديل</button>${tplEnd(t)}`).join('')||"<div class='card m'>لا مهام في هذا اليوم.</div>"}${rd<td?"<div class='m'>الأيام السابقة للعرض والمراجعة فقط، ولا تُضاف إليها مهام.</div>":''}`}
weekV=function(){const w=wk0(rd);return`<div class='row sp'><button class='b' onclick='rv="";render()'>← الروتين</button>${planBtn()}${nv('rd=add(rd,-7);render()','rd=add(rd,7);render()','rd=today();render()')}</div><h2>أسبوع ${fd(w)} ← ${fd(add(w,6))}</h2>${routineAddFormFixed()}${[0,1,2,3,4,5,6].map(i=>{const d=add(w,i),c=sum(d,d,fr0(rr)),n=S.tasks.filter(t=>t.rt===rr&&t.date===d&&t.status!=='cancelled').length;return`<div class='card row sp' style='${d===today()?'border-color:var(--r)':''}'><span><b>${fd(d)}</b><div class='m'>${n} مهمة · إنجاز ${c.pct==null?'—':c.pct+'%'} · ${c.rm} متبقية</div></span><span><button class='b p' data-d='${d}' onclick='od(this.dataset.d)'>فتح</button> <button class='b' data-d='${d}' onclick='rtCopy(this.dataset.d)'>نسخ</button></span></div>`}).join('')}`}
monV=function(){const[y,m]=rmn.split('-').map(Number),N=new Date(y,m,0).getDate(),off=(new Date(rmn+'-01T12:00:00').getDay()+1)%7,td=today(),cell=d=>{const L=S.tasks.filter(t=>t.rt===rr&&t.date===d&&t.status!=='cancelled'),n=L.length,dn=L.filter(t=>t.status==='done').length,ms=L.filter(t=>t.status==='missed'||(t.status==='scheduled'&&d<td)).length,rm=L.filter(t=>t.status==='scheduled'&&d>=td).length;return n?(dn===n?'✓':(ms?'✗'+ms:'')+(rm?'●'+rm:'')):''};return`<div class='row sp'><button class='b' onclick='rv="";render()'>← الروتين</button>${planBtn()}${nv('shM(-1)','shM(1)','rmn=today().slice(0,7);render()')}</div><h2>${new Date(rmn+'-01T12:00:00').toLocaleDateString('ar-EG',{month:'long',year:'numeric'})}</h2>${routineAddFormFixed()}<div style='display:grid;grid-template-columns:repeat(7,1fr);gap:4px'>${DN.map(n=>`<div class='m' style='text-align:center;font-size:11px'>${n}</div>`).join('')}${'<div></div>'.repeat(off)}${[...Array(N).keys()].map(i=>{const d=rmn+'-'+p(i+1);return`<button class='b' data-d='${d}' onclick='od(this.dataset.d)' style='min-height:54px;padding:2px;font-size:12px;border:${d===td?'2px solid var(--r)':d===rd?'2px solid #fff':'1px solid var(--b)'}'>${i+1}<br>${cell(d)}</button>`}).join('')}</div><div class='m' style='margin-top:8px'>✓ اكتمل الروتين · ●n متبقية · ✗n فائتة أو تنتظر المراجعة · الإطار الأحمر = اليوم</div>`}
rtAdd=function(){const f=document.getElementById('rf').elements,title=f.title.value.trim(),date=f.dueDate.value;if(!title)return alert('اكتب اسم المهمة');if(!validLocalDate(date)||date<today())return alert('اختر تاريخ استحقاق محليًا صالحًا من اليوم فصاعدًا');const sc=f.mode.value,m=scM(sc);if(sc==='week'&&(date<today()||date>wkEnd(today())))return alert('«هذا الأسبوع فقط» متاح لتواريخ هذا الأسبوع الحالي فقط، حتى الجمعة '+wkEnd(today()));const scope=(SCO[rr].find(x=>x[0]===sc)||['',''])[1],confirmText=`النطاق: «${scope}» بدءًا من ${date}.\nلن تتغير المهام القديمة ولا سجلات الإنجاز ولا XP السابق، ولن تُنشأ نسخ مكررة. تأكيد الحفظ؟`+(sc==='week'?routineWeekNotice(date):'');if(!confirm(confirmText))return;const mins=+f.mins.value||30,[r,pn]=calc(+f.imp.value,+f.diff.value,mins),createdAt=new Date().toISOString(),o={title,note:f.note.value.trim(),imp:+f.imp.value,diff:+f.diff.value,mins,spec:S.specs[0].id,type:'روتين',cat:f.cat.value,sk:f.sk.value,rt:rr,time:f.at.value,per:m==='once'?'none':m,reward:r,penalty:f.opt.checked?0:pn,source:'routine',createdAt};if(m==='once'){const t={...o,id:S.seq++,date,status:'scheduled',pp:0};S.tasks.push(t);if(f.at.value)S.alarms.push({id:S.seq++,name:title,time:f.at.value,msg:'حان وقت: '+title,mode:'once',days:[],date,tid:t.id,on:true,last:''});ev('create','روتين: '+title,t.id)}else{let dows,doms;if(m==='weekly'){dows=sc==='same'?[new Date(date+'T12:00:00').getDay()]:[...document.querySelectorAll('.dw:checked')].map(c=>+c.value);if(!dows.length)return alert('اختر يومًا واحدًا على الأقل أو اضغط «اقترح التوزيع»')}if(sc==='same'&&m==='monthly')doms=[+date.slice(8)];if(m==='monthly'&&sc!=='same'&&sc!=='nth'){doms=f.doms.value.split(/[,،\s]+/).map(Number).filter(x=>x>=1&&x<=31);if(!doms.length)return alert('اكتب أيام الشهر أو اضغط «اقترح التوزيع»')}if(f.at.value&&m!=='monthly'&&sc!=='week')S.alarms.push({id:S.seq++,name:title,time:f.at.value,msg:'حان وقت: '+title,mode:'repeat',days:m==='weekly'?dows:[],date:'',tid:null,on:true,last:''});const tplId='T'+S.seq++;S.tpl.push({id:tplId,f:o,rt:rr,nth:sc==='nth'?{w:new Date(date+'T12:00:00').getDay(),k:Math.ceil(+date.slice(8)/7)}:undefined,endDate:sc==='week'?wkEnd(date):null,rep:m,start:date,dows,doms,dow:dows&&dows[0],dom:doms&&doms[0]});ev('create','قالب روتين: '+title);gen();if(sc==='week'&&f.at.value)S.tasks.filter(t=>t.tid===tplId&&t.date>=date&&t.date<=wkEnd(date)).forEach(t=>S.alarms.push({id:S.seq++,name:t.title,time:f.at.value,msg:'حان وقت: '+t.title,mode:'once',days:[],date:t.date,tid:t.id,on:true,last:''}))}save();render()};
render();
</script></body></html>
